# --- project-level (hits the project_summary chunk) -----------------------------
- question: What is Gliimr?
  expected_answerable: true
  notes: Should retrieve the Gliimr project_summary chunk and cite the project description; README also relevant.
- question: What projects has the candidate built?
  expected_answerable: true
  notes: Gliimr, diabetic retinopathy detection, (Haystack contribution). Project summary chunk expected in sources.

# --- code questions (code path quality signal) --------------------------------
- question: What does agent.ts do overall?
  expected_answerable: true
  notes: Turn orchestration for Talk (glance/reflect) and Journal flows. "Projects referenced" should list Gliimr. Cite corpus/code/agent.ts:lines.
- question: How does the initAgent function work?
  expected_answerable: true
  notes: Names a specific function -> tests symbols + header. Cite exact lines.
- question: How does the agent handle an undo request from the user?
  expected_answerable: true
  notes: detectUndoIntent / runUndoWork in agent.ts. If a split function is retrieved, all parts should appear in order.
- question: How is the Gemma model output cleaned before it is shown?
  expected_answerable: true
  notes: cleanGemmaOutput in agent.ts.
- question: How does the Dynamic Bayesian Network get trained in Gliimr?
  expected_answerable: true
  notes: README "Training" section; code fences in README should not be split.
- question: Show me the candidate's Rust code for the payment service.
  expected_answerable: false
  notes: No Rust code / payment service in the corpus -> exact refusal phrase.

