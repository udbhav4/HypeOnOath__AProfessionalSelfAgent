# Phase 1 eval set (guideline v4, Section 8; design doc Sections 8 and 10).
# Judged by hand: correct answer, correct citation, correct refusal.
# Fields: question, expected_answerable (bool), notes (what a good answer /
# the retrieval should look like). No expected-answer text: no string matching.

# --- (a) single-chunk lookups ------------------------------------------------
- question: What is the candidate currently studying, and where?
  expected_answerable: true
  notes: MSc AI & ML at TU Darmstadt (CV education table / about-me / cover letter).
- question: What was the candidate's role at Cleartrip?
  expected_answerable: true
  notes: Assistant Manager - Planning & Growth (Data Analytics); cite a CV.
- question: How accurate was the loan default prediction model the candidate built?
  expected_answerable: true
  notes: 90% accuracy, EMI default rate reduced by 30% (Freecharge).
- question: What accuracy did the diabetic retinopathy detection project achieve?
  expected_answerable: true
  notes: 97% accuracy, 3% false negative rate; hybrid CNN-DNN.
- question: Which languages does the candidate speak, and at what level?
  expected_answerable: true
  notes: English C1, German A2 (B1 in progress).
- question: Where can I find the candidate's GitHub or LinkedIn profile?
  expected_answerable: true
  notes: Tests the re-attached "## Links" section of converted CVs.
- question: Which award did the candidate receive at Freecharge?
  expected_answerable: true
  notes: FC Warrior award (Nov 2022 - Mar 2023).

