      and its table_strategy settings did not fix it -> switched to docling for its dedicated table-structure recognition
      model; (2) docling dropped the URLs of clickable links (LinkedIn, GitHub) -> an independent, always-on hyperlink-extraction
      pass was added; (3) a document-level content-type rule would have mislabeled the mixed prose-and-table design doc ->
      content type is now decided per block at chunk time; (4) Render''s free tier has an ephemeral filesystem, so the index
      cannot be updated on the running server -> the index is committed and ships with each push-triggered redeploy.'
    key_points:
